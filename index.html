<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ProjectJAV 업데이터</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PJAV앱">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(4.8rem + env(safe-area-inset-bottom));
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen select-none">

  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-30 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">⚡</span>
        <div>
          <h1 class="font-extrabold text-base text-white leading-tight">ProjectJAV 업데이터</h1>
          <p id="status-text" class="text-[11px] text-slate-400">데이터 불러오는 중...</p>
        </div>
      </div>
      <button onclick="loadDataJson()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow active:scale-95 transition">
        🔄 목록 갱신
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <input type="text" id="search-input" oninput="renderItems()" placeholder="품번, 제목, 날짜 실시간 검색..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none">

    <div id="date-tabs" class="flex space-x-1.5 overflow-x-auto pb-1 scrollbar-none"></div>

    <div id="items-container" class="space-y-6"></div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 z-30" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-md mx-auto grid grid-cols-3 py-2">
      <button onclick="switchView('list')" id="nav-list" class="flex flex-col items-center text-indigo-400">
        <span class="text-lg">📅</span>
        <span class="text-[11px] font-bold mt-0.5">일자별 목록</span>
      </button>
      <button onclick="switchView('saved')" id="nav-saved" class="flex flex-col items-center text-slate-500 relative">
        <span class="text-lg">⭐</span>
        <span class="text-[11px] font-bold mt-0.5">보관함</span>
        <span id="saved-badge" class="hidden absolute top-0 right-8 bg-rose-500 text-white text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
      <a href="https://projectjav.com" target="_blank" class="flex flex-col items-center text-slate-500">
        <span class="text-lg">🌐</span>
        <span class="text-[11px] font-bold mt-0.5">원본 사이트</span>
      </a>
    </div>
  </nav>

  <!-- 상세 및 첨부파일 모달 -->
  <div id="detail-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-start border-b border-slate-700 pb-3">
        <div class="pr-2">
          <span id="modal-date" class="text-[11px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold">날짜</span>
          <h3 id="modal-title" class="font-extrabold text-base text-white mt-1.5 break-all leading-snug">제목</h3>
        </div>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <div id="modal-images" class="rounded-xl bg-slate-950 overflow-hidden"></div>

      <div class="space-y-2">
        <h4 class="text-xs font-extrabold text-slate-300 flex items-center justify-between">
          <span>📥 첨부파일 & 마그넷 다운로드</span>
          <span id="modal-file-count" class="text-[11px] text-indigo-400"></span>
        </h4>
        <div id="modal-attachments" class="space-y-2"></div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button id="modal-save-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold text-xs">⭐ 보관함 저장</button>
        <a id="modal-origin-link" href="#" target="_blank" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-xs text-center">🔗 원본 페이지 열기</a>
      </div>
    </div>
  </div>

  <script>
    let allItems = [];
    let savedItems = JSON.parse(localStorage.getItem('pjav_saved_items') || '[]');
    let currentView = 'list';
    let currentDateFilter = 'ALL';

    function getSafeImageUrl(url) {
      if (!url) return '';
      return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=640&output=webp`;
    }

    async function loadDataJson() {
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('아직 data.json 파일이 생성되지 않았습니다.');
        const data = await res.json();
        allItems = data.items || [];
        document.getElementById('status-text').textContent = `⚡ 최근 수집: ${data.updatedAt || '방금 전'} (${allItems.length}건)`;
        renderDateTabs();
        renderItems();
      } catch (err) {
        document.getElementById('status-text').textContent = '수집 대기 중';
        document.getElementById('items-container').innerHTML = `
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 text-xs text-slate-300 space-y-2 leading-relaxed">
            <p class="font-extrabold text-sm text-indigo-400">🤖 GitHub Actions 첫 데이터 수집 중입니다!</p>
            <p>GitHub 저장소 상단의 <strong>[Actions]</strong> 탭에서 초록색 체크(완료)가 뜬 뒤 <strong>[🔄 목록 갱신]</strong>을 누르면 0.1초 만에 전체 목록과 이미지가 표시됩니다.</p>
          </div>
        `;
      }
    }

    function renderDateTabs() {
      const dates = ['ALL', ...new Set(allItems.map(i => i.date))];
      document.getElementById('date-tabs').innerHTML = dates.map(d => {
        const active = currentDateFilter === d;
        const label = d === 'ALL' ? `전체 (${allItems.length})` : d;
        return `<button onclick="setDateFilter('${d}')" class="px-3 py-1.5 rounded-full text-xs font-bold shrink-0 transition ${active ? 'bg-indigo-600 text-white shadow' : 'bg-slate-800 text-slate-400 border border-slate-700'}">${label}</button>`;
      }).join('');
    }

    function setDateFilter(d) {
      currentDateFilter = d;
      renderDateTabs();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('items-container');
      const query = (document.getElementById('search-input').value || '').trim().toLowerCase();
      const source = currentView === 'saved' ? savedItems : allItems;

      const filtered = source.filter(i => {
        const matchDate = currentView === 'saved' || currentDateFilter === 'ALL' || i.date === currentDateFilter;
        const matchQuery = !query || i.title.toLowerCase().includes(query) || i.date.toLowerCase().includes(query);
        return matchDate && matchQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-slate-800/50 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">표시할 항목이 없습니다.</div>`;
        return;
      }

      const grouped = {};
      filtered.forEach(item => {
        const k = item.date || '최근 업데이트';
        if (!grouped[k]) grouped[k] = [];
        grouped[k].push(item);
      });

      container.innerHTML = Object.entries(grouped).map(([dateKey, list]) => `
        <div class="space-y-3">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-extrabold text-indigo-400">📅 ${dateKey}</h2>
            <span class="text-[11px] text-slate-500 font-bold">${list.length}건</span>
          </div>
          <div class="space-y-3">
            ${list.map(item => {
              const safeImg = getSafeImageUrl(item.thumb);
              const fileCount = (item.files || []).length;
              return `
                <div onclick="openDetail('${encodeURIComponent(item.url)}')" class="bg-slate-800 border border-slate-700/80 rounded-2xl overflow-hidden cursor-pointer active:scale-[0.99] transition shadow-md">
                  ${safeImg ? `
                    <div class="w-full h-44 bg-slate-950 relative">
                      <img src="${safeImg}" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentElement.style.display='none'" class="w-full h-full object-cover">
                      <span class="absolute top-2 left-2 bg-black/70 text-[10px] text-indigo-300 font-bold px-2 py-0.5 rounded">${item.date}</span>
                    </div>
                  ` : ''}
                  <div class="p-3.5 flex items-center justify-between space-x-2">
                    <div class="overflow-hidden">
                      <h3 class="font-bold text-sm text-slate-100 leading-snug line-clamp-2">${item.title}</h3>
                      <span class="inline-block mt-1.5 text-[10px] px-2 py-0.5 rounded font-bold ${fileCount > 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-300'}">
                        ${fileCount > 0 ? `📥 첨부파일 ${fileCount}개 즉시 다운로드` : '🔗 상세/원본 이동'}
                      </span>
                    </div>
                    <span class="text-slate-400 text-lg shrink-0">📥</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');

      const badge = document.getElementById('saved-badge');
      badge.textContent = savedItems.length;
      badge.classList.toggle('hidden', savedItems.length === 0);
    }

    function openDetail(encodedUrl) {
      const url = decodeURIComponent(encodedUrl);
      const item = allItems.find(i => i.url === url) || savedItems.find(i => i.url === url);
      if (!item) return;

      document.getElementById('modal-date').textContent = item.date;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-origin-link').href = item.url;

      const imgBox = document.getElementById('modal-images');
      imgBox.innerHTML = item.thumb
        ? `<img src="${getSafeImageUrl(item.thumb)}" referrerpolicy="no-referrer" class="w-full max-h-72 object-contain mx-auto">`
        : '';

      const files = item.files || [];
      document.getElementById('modal-file-count').textContent = `${files.length}개 파일`;
      const attBox = document.getElementById('modal-attachments');

      if (files.length === 0) {
        attBox.innerHTML = `<div class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-400">아래 [원본 페이지 열기]에서 파일을 직접 다운로드하세요.</div>`;
      } else {
        attBox.innerHTML = files.map(f => {
          const isMag = f.url.startsWith('magnet:');
          return `
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex items-center justify-between space-x-2">
              <div class="overflow-hidden">
                <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${isMag ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">${isMag ? '🧲 MAGNET' : '📄 FILE'}</span>
                <p class="text-xs font-bold text-white truncate mt-1">${f.label}</p>
              </div>
              <div class="flex space-x-1.5 shrink-0">
                <button onclick="navigator.clipboard.writeText('${f.url.replace(/'/g, "\\'")}'); alert('복사 완료!');" class="bg-slate-800 text-slate-200 px-2.5 py-2 rounded-lg text-xs font-bold">복사</button>
                <a href="${f.url}" download target="_blank" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-extrabold">다운로드</a>
              </div>
            </div>
          `;
        }).join('');
      }

      const saveBtn = document.getElementById('modal-save-btn');
      const isSaved = savedItems.some(s => s.url === item.url);
      saveBtn.textContent = isSaved ? '🗑️ 보관함에서 제거' : '⭐ 보관함 저장';
      saveBtn.onclick = () => {
        const idx = savedItems.findIndex(s => s.url === item.url);
        if (idx >= 0) savedItems.splice(idx, 1);
        else savedItems.unshift(item);
        localStorage.setItem('pjav_saved_items', JSON.stringify(savedItems));
        closeDetailModal();
        renderItems();
      };

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

    function switchView(v) {
      currentView = v;
      document.getElementById('nav-list').className = v === 'list' ? 'flex flex-col items-center text-indigo-400' : 'flex flex-col items-center text-slate-500';
      document.getElementById('nav-saved').className = v === 'saved' ? 'flex flex-col items-center text-indigo-400 relative' : 'flex flex-col items-center text-slate-500 relative';
      renderItems();
    }

    loadDataJson();
  </script>
</body>
</html>

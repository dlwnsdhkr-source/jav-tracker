<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ProjectJAV 업데이터</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PJAV앱">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(5.2rem + env(safe-area-inset-bottom));
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none">

  <!-- 상단 고정 헤더 -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-30 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">⚡</span>
        <div>
          <h1 class="font-extrabold text-base text-white leading-tight">ProjectJAV 업데이터</h1>
          <p id="status-text" class="text-[11px] text-amber-400">앱 초기화 중...</p>
        </div>
      </div>
      <button onclick="loadDataJson()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow active:scale-95 transition">
        🔄 목록 갱신
      </button>
    </div>
  </header>

  <!-- 메인 컨텐츠 -->
  <main class="max-w-md mx-auto p-3.5 space-y-3.5">

    <!-- 검색창 -->
    <div class="relative">
      <input type="text" id="search-input" oninput="renderItems()" placeholder="품번(예: Muka-011), 배우명, 태그 검색..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-3.5 pr-9 py-2.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none">
      <button onclick="clearSearch()" id="clear-search-btn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm px-1">✕</button>
    </div>

    <!-- 기간(시작일 ~ 종료일) 필터 박스 -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-extrabold text-indigo-400">📅 업데이트 기간 필터</span>
        <span id="filter-count-label" class="text-[11px] font-bold text-slate-400">대기 중</span>
      </div>

      <div class="flex items-center space-x-1.5 text-xs">
        <input type="date" id="start-date" onchange="onCustomDateChange()" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-slate-200 outline-none">
        <span class="text-slate-500 font-bold">~</span>
        <input type="date" id="end-date" onchange="onCustomDateChange()" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-slate-200 outline-none">
      </div>

      <div class="flex space-x-1.5 overflow-x-auto scrollbar-none pt-0.5">
        <button onclick="setQuickRange('ALL')" id="range-ALL" class="range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-indigo-600 text-white shrink-0">전체 기간</button>
        <button onclick="setQuickRange(0)" id="range-0" class="range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 shrink-0">최신 당일</button>
        <button onclick="setQuickRange(3)" id="range-3" class="range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 shrink-0">최근 3일</button>
        <button onclick="setQuickRange(7)" id="range-7" class="range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 shrink-0">최근 7일</button>
        <button onclick="setQuickRange(30)" id="range-30" class="range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 shrink-0">최근 30일</button>
      </div>
    </div>

    <!-- 작품 카드 리스트 -->
    <div id="items-container" class="space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center text-xs text-slate-400">
        데이터 파일을 확인하고 있습니다...
      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 z-30" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-md mx-auto grid grid-cols-3 py-2">
      <button onclick="switchView('list')" id="nav-list" class="flex flex-col items-center text-indigo-400">
        <span class="text-lg">📅</span>
        <span class="text-[11px] font-bold mt-0.5">기간별 작품</span>
      </button>
      <button onclick="switchView('saved')" id="nav-saved" class="flex flex-col items-center text-slate-500 relative">
        <span class="text-lg">⭐</span>
        <span class="text-[11px] font-bold mt-0.5">보관함</span>
        <span id="saved-badge" class="hidden absolute top-0 right-8 bg-rose-500 text-white text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
      <a href="https://projectjav.com" target="_blank" class="flex flex-col items-center text-slate-500">
        <span class="text-lg">🌐</span>
        <span class="text-[11px] font-bold mt-0.5">원본 사이트</span>
      </a>
    </div>
  </nav>

  <!-- 배우 프로필 대표 이미지 모달 (AVDBS 연동) -->
  <div id="actress-modal" onclick="if(event.target===this) closeActressModal()" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl space-y-3.5 p-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded font-bold">👩 AVDBS 배우 프로필</span>
          <h3 id="actress-modal-name" class="font-extrabold text-lg text-white mt-1">배우 이름</h3>
        </div>
        <button onclick="closeActressModal()" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>
      <div id="actress-img-box" class="w-full h-72 bg-slate-950 rounded-2xl overflow-hidden flex flex-col items-center justify-center relative border border-slate-800"></div>
      <p id="actress-desc" class="text-xs text-slate-400 text-center leading-relaxed"></p>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="actress-filter-btn" class="bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl font-extrabold text-xs shadow active:scale-95 transition">
          🎬 이 배우 작품만 보기
        </button>
        <a id="actress-avdbs-btn" href="#" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-bold text-xs text-center flex items-center justify-center shadow">
          🔎 AVDBS 프로필 열기 ↗
        </a>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg hidden z-50">
    복사되었습니다!
  </div>

  <script>
    const safeStore = {
      get: (k, def) => { try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e) { return def; } },
      set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
    };

    let allItems = [];
    let savedItems = safeStore.get('pjav_saved_v2', []);
    // 기존에 잘못 캐시된 actor.php 웹페이지 주소를 무시하도록 새 캐시 키(v3) 사용
    let actressImgCache = safeStore.get('pjav_actress_img_v3', {});
    let currentView = 'list';

    // URL이 웹페이지(.php 등)가 아닌 실제 이미지 URL인지 검증
    function isValidImageUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const low = url.toLowerCase();
      if (low.includes('actor.php') || low.includes('actor_list.php') || low.includes('search.php')) return false;
      return true;
    }

    function getSafeImageUrl(url) {
      if (!isValidImageUrl(url)) return '';
      return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=800&output=webp';
    }

    window.handleImgError = function(imgEl, origUrl) {
      if (!imgEl.dataset.fallback && isValidImageUrl(origUrl)) {
        imgEl.dataset.fallback = '1';
        imgEl.src = origUrl;
      } else if (imgEl.parentElement) {
        imgEl.parentElement.style.display = 'none';
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2000);
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => showToast('📋 마그넷 링크가 복사되었습니다!'));
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      renderItems();
    }

    function parseNormalizedDate(item) {
      const raw = String(item.date || item.displayDate || '').trim();
      let m = raw.match(/^(20\d{2})[-./](\d{1,2})[-./](\d{1,2})/);
      if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
      m = raw.match(/^(\d{1,2})[./-](\d{1,2})[./-](20\d{2}|\d{2})/);
      if (m) {
        const yr = m[3].length === 2 ? '20' + m[3] : m[3];
        return yr + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
      }
      return '';
    }

    function setQuickRange(days) {
      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.className = 'range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 shrink-0';
      });
      const activeBtn = document.getElementById('range-' + days);
      if (activeBtn) {
        activeBtn.className = 'range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-indigo-600 text-white shrink-0 shadow';
      }

      const startInput = document.getElementById('start-date');
      const endInput = document.getElementById('end-date');

      if (days === 'ALL') {
        startInput.value = '';
        endInput.value = '';
        renderItems();
        return;
      }

      const validDates = allItems.map(parseNormalizedDate).filter(Boolean).sort();
      const maxDateStr = validDates.length > 0 ? validDates[validDates.length - 1] : new Date().toISOString().slice(0, 10);

      const endDateObj = new Date(maxDateStr + 'T00:00:00');
      const startDateObj = new Date(endDateObj);
      startDateObj.setDate(startDateObj.getDate() - Number(days));

      startInput.value = startDateObj.toISOString().slice(0, 10);
      endInput.value = endDateObj.toISOString().slice(0, 10);
      renderItems();
    }

    function onCustomDateChange() {
      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.className = 'range-btn px-3 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 shrink-0';
      });
      renderItems();
    }

    // 프록시를 통해 AVDBS 웹페이지 HTML을 가져오는 헬퍼
    async function fetchHtmlViaProxy(targetUrl) {
      const encoded = encodeURIComponent(targetUrl);
      const proxies = [
        'https://api.allorigins.win/raw?url=' + encoded,
        'https://api.codetabs.com/v1/proxy?quest=' + encoded,
        'https://corsproxy.io/?' + encoded
      ];
      for (const p of proxies) {
        try {
          const r = await fetch(p);
          if (r.ok) {
            const txt = await r.text();
            if (txt && txt.length > 200) return txt;
          }
        } catch (e) {}
      }
      return '';
    }

    // AVDBS HTML 문서 안에서 진짜 배우 사진(.jpg/.png) URL만 뽑아내는 파서
    function parseRealActorImgFromAvdbsHtml(html) {
      if (!html) return '';
      const doc = new DOMParser().parseFromString(html, 'text/html');

      const og = doc.querySelector('meta[property="og:image"]');
      if (og && og.getAttribute('content')) {
        const c = og.getAttribute('content').trim();
        if (/\.(jpg|jpeg|png|webp)/i.test(c) && !/logo|banner/i.test(c)) {
          return c.startsWith('http') ? c : 'https://www.avdbs.com' + (c.startsWith('/') ? '' : '/') + c;
        }
      }

      const imgs = Array.from(doc.querySelectorAll('img'));
      for (const img of imgs) {
        const src = (img.getAttribute('data-src') || img.getAttribute('src') || '').trim();
        if (!src) continue;
        if (/logo|icon|banner|btn|blank|flag|svg/i.test(src)) continue;
        if (/\.(jpg|jpeg|png|webp)/i.test(src)) {
          return src.startsWith('http') ? src : 'https://www.avdbs.com' + (src.startsWith('/') ? '' : '/') + src;
        }
      }
      return '';
    }

    // AVDBS에서 배우 이름으로 검색 -> actor.php?actor_idx=... 페이지 탐색 -> 실제 .jpg 추출
    async function searchAvdbsActorPhoto(actressName) {
      const searchUrls = [
        'https://www.avdbs.com/menu/search.php?kwd=' + encodeURIComponent(actressName),
        'https://www.avdbs.com/menu/actor_list.php?kwd=' + encodeURIComponent(actressName)
      ];

      for (const sUrl of searchUrls) {
        const html = await fetchHtmlViaProxy(sUrl);
        if (!html) continue;

        const doc = new DOMParser().parseFromString(html, 'text/html');
        // 검색 결과 내 배우 고유 링크(actor.php?actor_idx=...) 찾기
        const actorLink = Array.from(doc.querySelectorAll('a[href*="actor.php?actor_idx="]'))[0];
        if (actorLink) {
          const href = actorLink.getAttribute('href');
          const fullActorPageUrl = href.startsWith('http') ? href : 'https://www.avdbs.com' + (href.startsWith('/') ? '' : '/menu/') + href.replace(/^\/?menu\//, '');

          // 검색 결과 카드 안에 이미 썸네일 이미지(.jpg)가 있으면 바로 추출
          const cardImg = parseRealActorImgFromAvdbsHtml(actorLink.parentElement ? actorLink.parentElement.outerHTML : '');
          if (cardImg) return { imgUrl: cardImg, pageUrl: fullActorPageUrl };

          // 상세 배우 페이지(actor.php?actor_idx=번호)로 접속해서 증명사진 추출
          const detailHtml = await fetchHtmlViaProxy(fullActorPageUrl);
          const detailImg = parseRealActorImgFromAvdbsHtml(detailHtml);
          if (detailImg) return { imgUrl: detailImg, pageUrl: fullActorPageUrl };
        }

        const directImg = parseRealActorImgFromAvdbsHtml(html);
        if (directImg) return { imgUrl: directImg, pageUrl: sUrl };
      }
      return { imgUrl: '', pageUrl: 'https://www.avdbs.com/menu/search.php?kwd=' + encodeURIComponent(actressName) };
    }

    async function loadDataJson() {
      const statusEl = document.getElementById('status-text');
      const container = document.getElementById('items-container');
      statusEl.textContent = '🔄 data.json 불러오는 중...';

      const urlsToTry = [
        './data.json?t=' + Date.now(),
        'https://raw.githubusercontent.com/dlwnsdhkr-source/jav-tracker/main/data.json?t=' + Date.now(),
        'https://raw.githubusercontent.com/dlwnsdhkr-source/jav-updater/main/data.json?t=' + Date.now()
      ];

      let loadedData = null;
      let lastError = '';

      for (const u of urlsToTry) {
        try {
          const res = await fetch(u, { cache: 'no-store' });
          if (res.ok) {
            loadedData = await res.json();
            if (loadedData && Array.isArray(loadedData.items)) break;
          } else {
            lastError = 'HTTP ' + res.status;
          }
        } catch (err) {
          lastError = err.message;
        }
      }

      if (!loadedData || !Array.isArray(loadedData.items)) {
        statusEl.textContent = '⚠️ data.json 파일 없음 (' + lastError + ')';
        container.innerHTML = '<div class="bg-rose-950/60 border border-rose-800 rounded-2xl p-5 text-xs text-rose-200">GitHub [Actions] 탭에서 데이터 수집이 완료된 후 [🔄 목록 갱신]을 눌러주세요.</div>';
        return;
      }

      allItems = loadedData.items.filter(i => i && i.title && i.title.toLowerCase() !== 'download').map(item => {
        // 만약 data.json의 actressImages에 미리 수집된 실제 이미지가 있으면 캐시에 등록
        if (item.actressImages && typeof item.actressImages === 'object') {
          Object.entries(item.actressImages).forEach(([k, v]) => {
            if (isValidImageUrl(v)) actressImgCache[k] = { imgUrl: v, pageUrl: 'https://www.avdbs.com/menu/search.php?kwd=' + encodeURIComponent(k) };
          });
        }

        // 혹시 thumb에 actor.php?actor_idx=12892 같은 잘못된 링크가 들어있으면 비워서 엑스박스 방지
        const cleanThumb = isValidImageUrl(item.thumb) ? item.thumb : '';

        return {
          title: item.title || '제목 없음',
          url: item.url || '#',
          date: item.date || '',
          displayDate: item.displayDate || item.date || '',
          thumb: cleanThumb,
          actress: Array.isArray(item.actress) ? item.actress : [],
          tags: Array.isArray(item.tags) ? item.tags : [],
          torrents: Array.isArray(item.torrents) ? item.torrents : []
        };
      });

      safeStore.set('pjav_actress_img_v3', actressImgCache);
      statusEl.textContent = '⚡ 최근 수집: ' + (loadedData.updatedAt || '완료') + ' (' + allItems.length + '작품)';
      statusEl.className = 'text-[11px] text-emerald-400 font-bold';
      renderItems();
    }

    async function openActressModal(actressName) {
      const modal = document.getElementById('actress-modal');
      const nameEl = document.getElementById('actress-modal-name');
      const imgBox = document.getElementById('actress-img-box');
      const descEl = document.getElementById('actress-desc');
      const filterBtn = document.getElementById('actress-filter-btn');
      const avdbsBtn = document.getElementById('actress-avdbs-btn');

      nameEl.textContent = actressName;
      const defaultSearchUrl = 'https://www.avdbs.com/menu/search.php?kwd=' + encodeURIComponent(actressName);
      avdbsBtn.href = defaultSearchUrl;

      const relatedWorks = allItems.filter(i => (i.actress || []).some(a => a.toLowerCase() === actressName.toLowerCase()));
      const fallbackWorkThumb = (relatedWorks.find(w => isValidImageUrl(w.thumb)) || {}).thumb || '';

      filterBtn.onclick = () => {
        closeActressModal();
        document.getElementById('search-input').value = actressName;
        renderItems();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      modal.classList.remove('hidden');

      const cached = actressImgCache[actressName];
      if (cached && isValidImageUrl(cached.imgUrl)) {
        avdbsBtn.href = cached.pageUrl || defaultSearchUrl;
        renderActressImage(cached.imgUrl, fallbackWorkThumb, actressName, relatedWorks.length);
        return;
      }

      imgBox.innerHTML = '<div class="w-7 h-7 border-2 border-rose-500 border-t-transparent rounded-full animate-spin mb-2"></div><p class="text-xs text-slate-400">AVDBS에서 \'' + actressName + '\' 프로필 사진을 검색 중...</p>';
      descEl.textContent = '수집된 목록 내 출연작 ' + relatedWorks.length + '편';

      // 실시간 AVDBS 검색 실행
      const result = await searchAvdbsActorPhoto(actressName);
      if (result.pageUrl) avdbsBtn.href = result.pageUrl;

      const finalImg = isValidImageUrl(result.imgUrl) ? result.imgUrl : fallbackWorkThumb;
      if (finalImg) {
        actressImgCache[actressName] = { imgUrl: finalImg, pageUrl: result.pageUrl || defaultSearchUrl };
        safeStore.set('pjav_actress_img_v3', actressImgCache);
      }

      renderActressImage(finalImg, fallbackWorkThumb, actressName, relatedWorks.length);
    }

    function renderActressImage(primaryImg, workCoverImg, actressName, workCount) {
      const imgBox = document.getElementById('actress-img-box');
      const descEl = document.getElementById('actress-desc');
      if (isValidImageUrl(primaryImg)) {
        const safeUrl = getSafeImageUrl(primaryImg);
        const backupUrl = isValidImageUrl(workCoverImg) ? getSafeImageUrl(workCoverImg) : '';
        imgBox.innerHTML = '<img src="' + safeUrl + '" referrerpolicy="no-referrer" onerror="if(this.src!==\'' + backupUrl + '\' && \'' + backupUrl + '\'){this.src=\'' + backupUrl + '\';}else{this.style.display=\'none\';}" class="w-full h-full object-contain bg-black">';
        descEl.textContent = "현재 목록에 '" + actressName + "' 출연작이 총 " + workCount + "편 있습니다.";
      } else {
        imgBox.innerHTML = '<span class="text-3xl mb-2">👩</span><p class="text-xs text-slate-400 text-center px-4">프로필 사진을 직접 불러오지 못했습니다.<br>아래 [🔎 AVDBS 프로필 열기]를 눌러 확인해 보세요.</p>';
        descEl.textContent = '현재 목록 내 출연작: ' + workCount + '편';
      }
    }

    function closeActressModal() {
      document.getElementById('actress-modal').classList.add('hidden');
    }

    function toggleSave(encodedUrl) {
      const url = decodeURIComponent(encodedUrl);
      const item = allItems.find(i => i.url === url) || savedItems.find(i => i.url === url);
      if (!item) return;
      const idx = savedItems.findIndex(s => s.url === url);
      if (idx >= 0) {
        savedItems.splice(idx, 1);
        showToast('보관함에서 제거되었습니다.');
      } else {
        savedItems.unshift(item);
        showToast('⭐ 보관함에 저장되었습니다!');
      }
      safeStore.set('pjav_saved_v2', savedItems);
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('items-container');
      const query = (document.getElementById('search-input').value || '').trim().toLowerCase();
      document.getElementById('clear-search-btn').classList.toggle('hidden', !query);

      const startDate = document.getElementById('start-date').value;
      const endDate = document.getElementById('end-date').value;
      const source = currentView === 'saved' ? savedItems : allItems;

      const filtered = source.filter(i => {
        if (currentView !== 'saved' && (startDate || endDate)) {
          const itemDate = parseNormalizedDate(i);
          if (itemDate) {
            if (startDate && itemDate < startDate) return false;
            if (endDate && itemDate > endDate) return false;
          }
        }
        const hay = (i.title + ' ' + (i.actress || []).join(' ') + ' ' + (i.tags || []).join(' ') + ' ' + i.date).toLowerCase();
        return !query || hay.includes(query);
      });

      document.getElementById('filter-count-label').textContent = '검색 결과 ' + filtered.length + '건';

      const badge = document.getElementById('saved-badge');
      badge.textContent = savedItems.length;
      badge.classList.toggle('hidden', savedItems.length === 0);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">표시할 작품이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const safeImg = getSafeImageUrl(item.thumb);
        const origImg = (item.thumb || '').replace(/'/g, "\\'");
        const isSaved = savedItems.some(s => s.url === item.url);
        const torrents = item.torrents || [];
        const normDate = parseNormalizedDate(item) || item.displayDate || item.date;

        return `
          <article class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
            ${safeImg ? `
              <div class="w-full bg-black relative">
                <img src="${safeImg}" referrerpolicy="no-referrer" loading="lazy" onerror="handleImgError(this, '${origImg}')" class="w-full max-h-96 object-contain mx-auto">
              </div>
            ` : ''}

            <div class="p-4 space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <a href="${item.url}" target="_blank" class="font-extrabold text-base text-white hover:text-indigo-400 leading-snug break-words">
                  ${item.title}
                </a>
                <button onclick="toggleSave('${encodeURIComponent(item.url)}')" class="shrink-0 px-2.5 py-1 rounded-lg text-xs font-bold border ${isSaved ? 'bg-amber-500/20 border-amber-500/40 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-400'}">
                  ${isSaved ? '★ 저장됨' : '☆ 보관'}
                </button>
              </div>

              <div class="flex items-center space-x-2 text-xs text-slate-400">
                <span class="font-bold text-indigo-400">📅 ${normDate}</span>
                <span>·</span>
                <a href="${item.url}" target="_blank" class="underline hover:text-slate-200">원본 보기 ↗</a>
              </div>

              ${(item.actress.length || item.tags.length) ? `
                <div class="flex flex-wrap gap-1.5 pt-0.5">
                  ${item.actress.map(a => `
                    <button onclick="openActressModal('${a.replace(/'/g, "\\'")}')" class="text-[11px] bg-rose-500/20 hover:bg-rose-500/30 active:scale-95 border border-rose-500/40 text-rose-300 px-2.5 py-1 rounded-lg font-extrabold flex items-center space-x-1 transition">
                      <span>👩 ${a}</span>
                      <span class="text-[9px] text-rose-400">🔍AVDBS</span>
                    </button>
                  `).join('')}
                  ${item.tags.map(t => `
                    <button onclick="document.getElementById('search-input').value='${t.replace(/'/g, "\\'")}'; renderItems();" class="text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2 py-1 rounded-lg">
                      ${t}
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              <div class="pt-2 border-t border-slate-800/80 space-y-2">
                ${torrents.length > 0 ? torrents.map(t => `
                  <div class="bg-slate-950/90 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between gap-2">
                    <div class="flex items-center space-x-1.5 shrink-0">
                      ${t.downloadUrl ? `
                        <a href="${t.downloadUrl}" target="_blank" download class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-extrabold px-2.5 py-1.5 rounded-lg flex items-center space-x-1">
                          <span>📥</span><span>Download</span>
                        </a>
                      ` : ''}
                      ${t.magnetUrl ? `
                        <a href="${t.magnetUrl}" class="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white text-xs font-extrabold px-2.5 py-1.5 rounded-lg flex items-center space-x-1">
                          <span>🧲</span><span>Magnet</span>
                        </a>
                        <button onclick="copyText('${t.magnetUrl.replace(/'/g, "\\'")}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold px-2 py-1.5 rounded-lg">
                          복사
                        </button>
                      ` : ''}
                    </div>
                    <div class="text-right text-[11px] leading-tight">
                      <div class="font-extrabold text-emerald-400">${t.size || ''}</div>
                      <div class="text-slate-400">
                        ${t.seeds ? '<span class="text-sky-400">S:' + t.seeds + '</span> ' : ''}
                        ${t.leeches ? '<span class="text-amber-400">L:' + t.leeches + '</span> ' : ''}
                        ${t.date ? '<span>' + t.date + '</span>' : ''}
                      </div>
                    </div>
                  </div>
                `).join('') : `
                  <a href="${item.url}" target="_blank" class="block w-full text-center bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2.5 rounded-xl">
                    🔗 원본 페이지에서 다운로드 확인
                  </a>
                `}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchView(v) {
      currentView = v;
      document.getElementById('nav-list').className = v === 'list' ? 'flex flex-col items-center text-indigo-400' : 'flex flex-col items-center text-slate-500';
      document.getElementById('nav-saved').className = v === 'saved' ? 'flex flex-col items-center text-indigo-400 relative' : 'flex flex-col items-center text-slate-500 relative';
      renderItems();
    }

    loadDataJson();
  </script>
</body>
</html>
